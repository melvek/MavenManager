name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            archive: mvnmanager-windows-amd64.zip
          - os: macos-latest
            goos: darwin
            goarch: universal
            archive: mvnmanager-darwin-universal.zip
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            archive: mvnmanager-linux-amd64.tar.gz

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build (Windows / Linux)
        if: matrix.goos != 'darwin'
        run: wails3 build GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
        shell: bash

      - name: Build (macOS Universal)
        if: matrix.goos == 'darwin'
        run: wails3 task darwin:build:universal
        shell: bash

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path bin/* -DestinationPath ${{ matrix.archive }}

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd bin
          zip -r ../${{ matrix.archive }} *

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd bin
          tar -czvf ../${{ matrix.archive }} *

      - name: Upload to Draft Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}