name: Release Build

on:
  release:
    types: [published] # 仅在 Release 正式发布时触发

env:
  NODE_OPTIONS: "--max-old-space-size=4096" # 防止前端构建时内存溢出

jobs:
  build:
    strategy:
      fail-fast: false # 一个平台失败不影响其他平台
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            output: MavenManager.exe
            archive: mvnmanager-windows-amd64.zip
          - os: macos-latest
            platform: darwin/universal
            output: MavenManager.app
            archive: mvnmanager-darwin-universal.zip
          - os: ubuntu-latest
            platform: linux/amd64
            output: MavenManager
            archive: mvnmanager-linux-amd64.tar.gz

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # 允许上传到 Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25' # 需匹配你的 go.mod 要求

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build
        run: wails3 build -platform ${{ matrix.platform }} -o ${{ matrix.output }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path bin/${{ matrix.output }} -DestinationPath ${{ matrix.archive }}

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd bin
          zip -r ../${{ matrix.archive }} ${{ matrix.output }}

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd bin
          tar -czvf ../${{ matrix.archive }} ${{ matrix.output }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}